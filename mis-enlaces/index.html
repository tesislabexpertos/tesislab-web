<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mis enlaces | TesisLab Expertos</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#1B2A4A">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="robots" content="noindex, nofollow">
<style>
:root{--navy:#1B2A4A;--gold:#C9A24A;--ink:#1d2433;--muted:#5b6476;--line:#e2e6ee;--bg:#f5f6f9}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;font-family:Segoe UI,Roboto,Helvetica,Arial,sans-serif;background:var(--bg);color:var(--ink)}
header{background:var(--navy);color:#fff;padding:22px 16px 18px;text-align:center;border-top:5px solid var(--gold)}
header b{font-size:20px}header b span{color:var(--gold)}
header p{margin:6px 0 0;font-size:13px;color:#d6dcea}
main{max-width:560px;margin:0 auto;padding:12px 12px 90px}
h2{font-size:13px;letter-spacing:.6px;text-transform:uppercase;color:var(--muted);margin:20px 4px 8px}
.item{display:flex;align-items:center;gap:10px;background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:8px}
.txt{flex:1;min-width:0}
.txt strong{display:block;font-size:15px;color:var(--navy)}
.txt a{display:block;font-size:12.5px;color:var(--muted);text-decoration:none;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
button{flex:none;background:#000;color:#fff;border:0;border-radius:8px;padding:12px 16px;font-size:15px;font-weight:700;min-width:92px;cursor:pointer}
button.ok{background:#1f7a3f}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#000;color:#fff;padding:10px 18px;border-radius:20px;font-size:14px;opacity:0;transition:opacity .2s;pointer-events:none}
#toast.show{opacity:1}
footer{text-align:center;color:var(--muted);font-size:12px;margin-top:20px}
</style>
</head>
<body>
<header>
  <b>TesisLab <span>Expertos</span></b>
  <p>Toca "Copiar" y pega el enlace en WhatsApp, correo o redes</p>
</header>
<main id="list"></main>
<div id="toast">Copiado</div>
<script>
var grupos = [
  { titulo: 'Captar contactos', items: [
    ['Plantilla APA 7 gratis', 'https://tesislabexpertos.com/tesislab-web/plantilla-apa7.html'],
    ['Web de TesisLab', 'https://tesislabexpertos.com/tesislab-web/'],
    ['Agendar una consulta', 'https://calendar.app.google/CjQtQ6dooSonbmBw8']
  ]},
  { titulo: 'Vender el Kit del Tesista', items: [
    ['Kit del Tesista (página del producto)', 'https://go.hotmart.com/F108002424A?src=wa'],
    ['Kit del Tesista (pago directo)', 'https://pay.hotmart.com/F108002424A?sck=wa']
  ]},
  { titulo: 'Mis libros en Amazon', items: [
    ['Metodología de la Investigación y la Tesis en Word', 'https://www.amazon.com/dp/B0GL9NP3PL'],
    ['SPSS para tesis', 'https://www.amazon.com/dp/B0HKP2BQ2C']
  ]},
  { titulo: 'Contacto', items: [
    ['WhatsApp', 'https://wa.me/50768138959'],
    ['Correo', 'tesislabexpertos@gmail.com']
  ]},
  { titulo: 'Redes sociales', items: [
    ['Facebook', 'https://www.facebook.com/tesis.lab.expertos'],
    ['Instagram', 'https://www.instagram.com/tesis.lab.expertos'],
    ['TikTok', 'https://www.tiktok.com/@tesislabpty'],
    ['LinkedIn', 'https://www.linkedin.com/in/juancarloschavezpinzon']
  ]}
];

var list = document.getElementById('list');
grupos.forEach(function (g) {
  var h = document.createElement('h2'); h.textContent = g.titulo; list.appendChild(h);
  g.items.forEach(function (it) {
    var row = document.createElement('div'); row.className = 'item';
    var txt = document.createElement('div'); txt.className = 'txt';
    var s = document.createElement('strong'); s.textContent = it[0];
    var a = document.createElement('a'); a.textContent = it[1];
    a.href = it[1].indexOf('@') > -1 && it[1].indexOf('http') !== 0 ? 'mailto:' + it[1] : it[1];
    a.target = '_blank'; a.rel = 'noopener';
    txt.appendChild(s); txt.appendChild(a);
    var b = document.createElement('button'); b.type = 'button'; b.textContent = 'Copiar';
    b.setAttribute('aria-label', 'Copiar enlace de ' + it[0]);
    b.addEventListener('click', function () { copiar(it[1], b); });
    row.appendChild(txt); row.appendChild(b); list.appendChild(row);
  });
});
var f = document.createElement('footer'); f.textContent = 'TesisLab Expertos. WhatsApp (+507) 6813-8959'; list.appendChild(f);

function respaldo(texto) {
  var t = document.createElement('textarea');
  t.value = texto; t.setAttribute('readonly', '');
  t.style.position = 'absolute'; t.style.left = '-9999px';
  document.body.appendChild(t); t.select(); t.setSelectionRange(0, texto.length);
  var ok = false; try { ok = document.execCommand('copy'); } catch (e) {}
  t.remove(); return ok;
}
function avisar(b, ok) {
  var toast = document.getElementById('toast');
  toast.textContent = ok ? 'Enlace copiado' : 'Mantén presionado el enlace para copiarlo';
  toast.classList.add('show');
  if (ok) { b.textContent = 'Copiado'; b.classList.add('ok'); }
  setTimeout(function () { toast.classList.remove('show'); b.textContent = 'Copiar'; b.classList.remove('ok'); }, 1600);
}
function copiar(texto, b) {
  if (navigator.clipboard && window.isSecureContext) {
    navigator.clipboard.writeText(texto).then(function () { avisar(b, true); }, function () { avisar(b, respaldo(texto)); });
  } else { avisar(b, respaldo(texto)); }
}
if ('serviceWorker' in navigator) { navigator.serviceWorker.register('sw.js').catch(function () {}); }
</script>
</body>
</html>
