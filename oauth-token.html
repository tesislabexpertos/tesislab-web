<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Token de Acceso - TesisLab</title>
  <style>
    body { font-family: Arial, sans-serif; max-width: 800px; margin: 40px auto; padding: 20px; background: #f9f9f9; }
    h2 { color: #1B4F8A; }
    .card { background: white; border-radius: 10px; padding: 20px; margin: 15px 0; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
    .tb { background: #f0f0f0; padding: 15px; border-radius: 8px; word-break: break-all; font-family: monospace; font-size: 13px; min-height: 40px; }
    button { margin-top: 10px; padding: 10px 20px; background: #1B4F8A; color: white; border: none; border-radius: 5px; cursor: pointer; font-size: 15px; }
    .ok { color: green; font-weight: bold; }
    .err { color: red; }
    .warn { color: #cc7700; font-weight: bold; }
    input[type=password] { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 5px; font-size: 14px; box-sizing: border-box; margin-top: 6px; }
    .note { font-size: 12px; color: #666; margin-top: 5px; }
    .step { font-size: 18px; font-weight: bold; color: #1B4F8A; margin-bottom: 8px; }
  </style>
</head>
<body>
  <h2>Token de Acceso - TesisLab</h2>
  <div id="main"></div>
  <script>
    var qp=new URLSearchParams(window.location.search);
    var hp=new URLSearchParams(window.location.hash.slice(1));
    var code=qp.get('code');
    var token=hp.get('access_token')||qp.get('access_token');
    var main=document.getElementById('main');
    if(token){
      main.innerHTML='<div class="card"><p class="ok">Token obtenido. Cópialo y pégalo en n8n.</p><div class="tb" id="tb">'+token+'</div><br><button onclick="navigator.clipboard.writeText(document.getElementById(\'tb\').textContent);alert(\'Copiado\')">Copiar token</button></div>';
    } else if(code){
      main.innerHTML='<div class="card"><div class="step">Paso 1 - Codigo recibido</div><div class="tb" style="font-size:11px">'+code+'</div><button onclick="navigator.clipboard.writeText(\''+code+'\');alert(\'Copiado\')">Copiar codigo</button></div><div class="card"><div class="step">Paso 2 - App Secret</div><p><span class="note">Solo se usa en tu navegador, no se envia a servidores externos.</span></p><label>App Secret:</label><input type="password" id="secret" placeholder="Pega tu App Secret"/><br><br><button onclick="canjear()">Obtener Token</button><div id="result" style="margin-top:15px"></div></div>';
    } else {
      var err=qp.get('error_description')||qp.get('error')||'';
      main.innerHTML='<div class="card"><p class="err">No se encontro codigo ni token.</p>'+(err?'<p>'+err+'</p>':'')+'<p class="note">URL: '+window.location.href+'</p></div>';
    }
    async function canjear(){
      var secret=document.getElementById('secret').value.trim();
      var result=document.getElementById('result');
      if(!secret){result.innerHTML='<p class="err">Ingresa el App Secret.</p>';return;}
      result.innerHTML='<p class="warn">Canjeando...</p>';
      try{
        var b=new FormData();
        b.append('client_id','793357243771997');
        b.append('client_secret',secret);
        b.append('grant_type','authorization_code');
        b.append('redirect_uri','https://tesislabexpertos.github.io/tesislab-web/oauth-token.html');
        b.append('code',code);
        var r=await fetch('https://api.instagram.com/oauth/access_token',{method:'POST',body:b});
        var d=await r.json();
        if(d.access_token){
          result.innerHTML='<p class="ok">Token obtenido!</p><div class="tb" id="tb2">'+d.access_token+'</div><br><button onclick="navigator.clipboard.writeText(document.getElementById(\'tb2\').textContent);alert(\'Copiado\')">Copiar token</button><p class="note">User ID: '+d.user_id+'</p>';
        }else{throw new Error(JSON.stringify(d));}
      }catch(e){
        var cmd='curl -X POST https://api.instagram.com/oauth/access_token -F "client_id=793357243771997" -F "client_secret='+secret+'" -F "grant_type=authorization_code" -F "redirect_uri=https://tesislabexpertos.github.io/tesislab-web/oauth-token.html" -F "code='+code+'"';
        result.innerHTML='<p class="warn">CORS bloqueo. Ejecuta en CMD/PowerShell:</p><div style="background:#1e1e1e;color:#fff;padding:15px;border-radius:8px;font-family:monospace;font-size:11px;word-break:break-all">'+cmd+'</div><br><button onclick="navigator.clipboard.writeText(\''+cmd.replace(/\\/g,'\\\\').replace(/\'/g,\'\\\'\')+'\');alert(\'Copiado\')">Copiar comando</button>';
      }
    }
  </script>
</body>
</html>
